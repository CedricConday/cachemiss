[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachemiss"
version = "0.2.0"
description = "Explain why your Claude Code quota drained: every prompt-cache rebuild, its reason, its cost, and which sub-agent did it. Reads local transcripts only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Cedric Conday"}]
keywords = ["claude-code", "prompt-caching", "usage", "quota", "cache-miss", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/CedricConday/cachemiss"

[project.scripts]
cachemiss = "cachemiss.cli:main"

[tool.setuptools.packages.find]
include = ["cachemiss*"]

[tool.ruff]
line-length = 100
target-version = "py310"
